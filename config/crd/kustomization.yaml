# The CRD definitions themselves. Applied by `make install` and by
# `config/default`. Deliberately NOT delivered through GitOps: a GitOps project
# may admit the PlatformConfig *instance* while withholding the
# CustomResourceDefinitions that define it, because deleting a CRD deletes every
# CR of that kind (see the note on `make uninstall`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bases/k8boss.io_platformconfigs.yaml
  - bases/k8boss.io_runtimesecuritypolicies.yaml
  - bases/k8boss.io_segmentationpolicies.yaml
