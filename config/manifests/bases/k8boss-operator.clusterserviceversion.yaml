# CSV base. `operator-sdk generate bundle` merges this with the rendered
# config/manifests output to produce bundle/manifests/*.clusterserviceversion.yaml:
# it fills in `install` (from the Deployment), the RBAC split into
# permissions/clusterPermissions, `alm-examples` (from config/samples), the
# CRD schema descriptions, `createdAt` and the version/name stamp. Everything
# a generator cannot know — what this operator IS, what it needs, who answers
# for it — lives here and is hand-maintained.
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    # "Basic Install" is the honest rung: the operator reconciles CR intent and
    # reports status, but it does no lifecycle management of an operand it
    # owns, no backup/restore, no auto-tuning. Claiming higher is the kind of
    # confidently-wrong answer this project treats as a defect.
    capabilities: Basic Install
    categories: Security,Networking,Monitoring
    containerImage: ghcr.io/aesaganda/k8boss/k8boss-operator:latest
    # The date this VERSION was cut, not the date the bundle was last
    # regenerated. `operator-sdk generate bundle` stamps "now" on every run,
    # which makes the generated bundle differ from itself between two identical
    # builds — so `make bundle` copies this value back over it. Bump it by hand
    # when bumping VERSION. Format is validated: yyyy-mm-ddThh:mm:ssZ.
    createdAt: "2026-08-17T00:00:00Z"
    description: Reconciles Kubernetes-native segmentation and runtime-security
      intent into the K8Boss Knowledge Graph, with evidence.
    repository: https://github.com/aesaganda/k8boss
    support: https://github.com/aesaganda/k8boss/issues
  name: k8boss-operator.v0.0.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - name: platformconfigs.k8boss.io
        kind: PlatformConfig
        version: v1alpha1
        displayName: Platform Config
        description: >-
          Cluster-wide K8Boss operator configuration. Exactly one instance,
          named "default", governs the cluster: it selects the flow-telemetry
          provider and holds the kill switch that halts every K8Boss
          reconciler. An instance under any other name reports NotSingleton and
          governs nothing.
        resources:
          - kind: SegmentationPolicy
            version: v1alpha1
          - kind: RuntimeSecurityPolicy
            version: v1alpha1
        specDescriptors:
          - path: flowProvider
            displayName: Flow Provider
            description: >-
              Which FlowProvider backs flow telemetry for this cluster. This is
              observability only — enforcement is the CNI's job, and K8Boss
              does not claim to observe enforcement.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:select:RHNO
              - urn:alm:descriptor:com.tectonic.ui:select:Hubble
              - urn:alm:descriptor:com.tectonic.ui:select:Calico
              - urn:alm:descriptor:com.tectonic.ui:select:Goldmane
              - urn:alm:descriptor:com.tectonic.ui:select:Mock
          - path: paused
            displayName: Paused
            description: >-
              Halts every K8Boss reconciler without deleting or deregistering
              anything already reconciled. Defaults to TRUE so that a freshly
              installed operator cannot silently begin mutating cluster state.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        statusDescriptors:
          - path: conditions
            displayName: Conditions
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
          - path: providerHealth
            displayName: Provider Health
            description: >-
              One entry per provider the control plane reported, including
              providers whose health could NOT be determined (health=Unknown
              with a reason). A missing entry never means healthy.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Provider Health
          - path: observedGeneration
            displayName: Observed Generation
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:hidden

      - name: segmentationpolicies.k8boss.io
        kind: SegmentationPolicy
        version: v1alpha1
        displayName: Segmentation Policy
        description: >-
          Declares network segmentation intent for a set of workloads in one
          namespace. K8Boss reconciles that intent through its control-plane
          API and records it in the Knowledge Graph with evidence; it does not
          itself program the data plane.
        specDescriptors:
          - path: selector.matchLabels
            displayName: Workload Selector
            description: Labels selecting the workloads this policy governs, within its own namespace.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:selector:core:v1:Pod
          - path: ingress
            displayName: Ingress Rules
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Ingress
          - path: egress
            displayName: Egress Rules
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:fieldGroup:Egress
          - path: providerRef
            displayName: Flow Provider Override
            description: >-
              Overrides PlatformConfig.spec.flowProvider for this policy only.
              Empty uses the cluster default.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:advanced
        statusDescriptors:
          - path: conditions
            displayName: Conditions
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
          - path: resolvedFlowProvider
            displayName: Resolved Flow Provider
            description: >-
              Which FlowProvider this policy was reconciled under. NOT a claim
              that anything is enforcing the policy — it is set only on the
              confirmed-success path.
            x-descriptors:
              - urn:alm:descriptor:text
          - path: observedGeneration
            displayName: Observed Generation
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:hidden

      - name: runtimesecuritypolicies.k8boss.io
        kind: RuntimeSecurityPolicy
        version: v1alpha1
        displayName: Runtime Security Policy
        description: >-
          Attaches K8Boss Knowledge Graph evidence to an EXISTING Tetragon
          TracingPolicy for a set of workloads. It does not replace, generate
          or install Tetragon policy — K8Boss verifies what Tetragon reports.
        specDescriptors:
          - path: selector.matchLabels
            displayName: Workload Selector
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:selector:core:v1:Pod
          - path: tracingPolicyRef
            displayName: Tetragon TracingPolicy
            description: >-
              Name of an existing Tetragon TracingPolicy in this namespace.
              K8Boss correlates evidence against it; it does not create it.
            x-descriptors:
              - urn:alm:descriptor:text
          - path: deniedBinaries
            displayName: Denied Binaries
            description: >-
              Absolute paths whose execution K8Boss treats as a violation when
              correlating runtime evidence for the selected workloads.
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:text
        statusDescriptors:
          - path: conditions
            displayName: Conditions
            x-descriptors:
              - urn:alm:descriptor:io.kubernetes.conditions
          - path: observedGeneration
            displayName: Observed Generation
            x-descriptors:
              - urn:alm:descriptor:com.tectonic.ui:hidden

  description: |
    K8Boss gives you visibility into Kubernetes network policy, service-mesh
    posture, runtime process activity and GitOps delivery. It reads clusters,
    correlates what it finds, and routes every mutation through governance.

    This operator is the **Kubernetes-native intent layer** for that platform.
    It turns three CRDs into reconciled, evidence-backed facts in the K8Boss
    Knowledge Graph:

    * **SegmentationPolicy** — network segmentation intent for a set of
      workloads in a namespace.
    * **RuntimeSecurityPolicy** — attaches Knowledge Graph evidence to an
      existing Tetragon `TracingPolicy`.
    * **PlatformConfig** — a cluster-scoped singleton that selects the flow
      telemetry provider and holds the kill switch.

    ### Requires a K8Boss control plane — this operator does not install one

    This operator is a **bridge**, not an installer. Every reconcile is an
    authenticated call to a K8Boss backend that must already be running, and
    the operator writes nothing to a database directly. Before it can do any
    work you need:

    1. A K8Boss control plane, installed separately with the Helm chart at
       `deploy/helm/k8boss` in the project repository.
    2. This cluster registered in that control plane, which yields a numeric
       cluster id.
    3. An operator API token that matches `OPERATOR_API_TOKEN` on the backend.

    Installed without those, the operator comes up **healthy and idle** and
    says so on the CR status conditions rather than pretending to work. It
    deliberately distinguishes "nobody has told us where the backend is" from
    "the backend is down" — reporting the second as the first would be a claim
    the system cannot support.

    ### Design commitments

    * **No edge without evidence.** Every graph edge the operator creates
      records why it exists, where that came from and how sure it is.
    * **Time is a property of the edge.** Deleting a CR *closes* its edges
      through a finalizer; nothing is hard-deleted, so history stays queryable.
    * **Paused by default.** `PlatformConfig.spec.paused` defaults to `true`,
      so an operator with no configuration applied cannot silently start
      mutating cluster state.

    ### Documentation

    Architecture, the Knowledge Graph rules and the operator ADR live in
    `docs/` in the project repository.
  displayName: K8Boss
  icon:
    - base64data: 
      mediatype: image/svg+xml
  install:
    spec:
      deployments: null
    strategy: ""
  # AllNamespaces ONLY, and this is not a default left unexamined: PlatformConfig
  # is a CLUSTER-scoped CRD and the manager has no WATCH_NAMESPACE handling, so
  # it always watches cluster-wide. Advertising OwnNamespace/SingleNamespace
  # would let OLM create a Subscription whose scoping the operator then ignores
  # — the user would be told the operator is confined to one namespace while it
  # reconciles every namespace.
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - networkpolicy
    - segmentation
    - zero-trust
    - service-mesh
    - tetragon
    - runtime-security
    - knowledge-graph
    - gitops
  links:
    - name: Source
      url: https://github.com/aesaganda/k8boss
    - name: Documentation
      url: https://github.com/aesaganda/k8boss/tree/main/docs
    - name: Issues
      url: https://github.com/aesaganda/k8boss/issues
  # CONFIRM BEFORE SUBMITTING. These two blocks are a public support commitment
  # and a copyright-adjacent claim; see docs/operatorhub-migration.md, "Hard
  # gates". 293 of 667 commits are authored under a corporate address, so who
  # "provides" this operator is not a question this file should answer by
  # itself.
  maintainers:
    - name: Eren Saganda
      email: erensaganda@gmail.com
  provider:
    name: Eren Saganda
    url: https://github.com/aesaganda/k8boss
  maturity: alpha
  # seccompProfile: RuntimeDefault on the manager pod (config/manager/manager.yaml)
  # went GA in 1.19; PodSecurity admission, which the restricted-profile
  # securityContext here is written against, went GA in 1.25.
  minKubeVersion: 1.25.0
  version: 0.0.0
