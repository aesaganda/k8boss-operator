name: ci

# GitHub-HOSTED runners, deliberately. This repository is public and accepts
# fork pull requests, which means CI executes untrusted code by design; the
# K8Boss monorepo's self-hosted runners are personal hardware and must never be
# reachable from here.
on:
  push:
    branches: [main]
    # A `v*` tag is how a submission is cut: it publishes an immutable image
    # tag and prints the digest `make bundle-submission` needs.
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The controller suite runs against a real apiserver+etcd (envtest) and
      # hard-fails when the binaries are missing rather than skipping — a suite
      # that degrades to "no control plane, everything passes" is the defect
      # class it exists to hunt. `make test` provisions them via setup-envtest.
      - name: Test (envtest)
        run: make test

  generated:
    name: Generated artifacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: CRDs and deepcopy match the Go types
        # A CRD schema that drifts from its Go type ships an API the operator
        # does not implement. Regenerate and diff rather than trusting that
        # whoever edited the types remembered to run `make manifests`.
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5 \
            object:headerFile="" paths="./api/..."
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5 \
            crd paths="./api/..." output:crd:artifacts:config=config/crd/bases
          git diff --exit-code -- api config/crd

      - name: OLM bundle is current and passes the submission validators
        # bundle/ is GENERATED from config/{crd,rbac,manager,manifests,samples}
        # and is what OLM actually grants permissions from, so a stale bundle
        # does not fail loudly — it hands OLM the wrong RBAC.
        #
        # `make bundle` also runs the operatorframework and good-practices
        # validators that the k8s-operatorhub/community-operators pipeline gates
        # on, so a rejection surfaces here rather than in a PR against someone
        # else's repository.
        #
        # Generation is idempotent by construction: `make bundle` restores
        # createdAt from the CSV base, because operator-sdk otherwise stamps the
        # current time and the diff below could never pass.
        env:
          OPERATOR_SDK_VERSION: v1.42.3
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/operator-sdk" \
            "https://github.com/operator-framework/operator-sdk/releases/download/${OPERATOR_SDK_VERSION}/operator-sdk_linux_amd64"
          chmod +x "$RUNNER_TEMP/operator-sdk"
          make bundle \
            OPERATOR_SDK="$RUNNER_TEMP/operator-sdk" \
            KUSTOMIZE="go run sigs.k8s.io/kustomize/kustomize/v5@v5.4.3"
          git diff --exit-code -- bundle config/manifests

  # ── publish ──────────────────────────────────────────────────────────────
  # The operator image has to be ANONYMOUSLY pullable or the OperatorHub
  # submission fails outright: the community-operators pipeline does a
  # credential-less `docker pull` of whatever the CSV's containerImage names,
  # and upstream's troubleshooting guide calls a private image the single most
  # common cause of a rejected submission.
  #
  # It is published from HERE, not from the K8Boss monorepo, for two reasons
  # that are not stylistic:
  #   * The monorepo's build-images.yml matrix builds backend/frontend/agent
  #     and no longer builds an operator image at all.
  #   * That workflow is pinned to `runs-on: [self-hosted, docker-rootful]`,
  #     and the only runner carrying the label is offline — eight builds are
  #     queued behind it. A public listing cannot depend on one personal box.
  # GitHub-hosted runners have a rootful daemon, so the multi-arch build that
  # needs binfmt registration works here without that label.
  publish:
    name: Publish image
    # Never publish code that did not pass, and never from a fork PR (which has
    # no package-write token anyway). Same `needs:` discipline as the monorepo.
    needs: [build, generated]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 matters: OpenShift and EKS both run arm64 control planes, and an
      # amd64-only operator image fails to schedule there with an exec format
      # error that reads like a broken binary rather than a missing platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` = the newest RELEASED version, and nothing else.
          #
          # This is spelled out because the obvious-looking alternative is what
          # was here first and it was wrong: a raw `latest` gated on
          # is_default_branch, PLUS `type=ref,event=tag`. That does not mean
          # "latest from main only" — flavor.latest defaults to `auto`, which
          # adds `latest` on any semver tag regardless. So `latest` was pushed
          # from BOTH, and every main push moved it to unreleased code until the
          # next tag moved it back. An operator image whose `latest` flips
          # between released and unreleased is a trap for anyone who pulls it,
          # and config/manager/kustomization.yaml pins `newTag: latest` for
          # `make deploy`.
          #
          # flavor.latest is now explicit rather than inherited, so the rule is
          # readable here instead of being a default someone has to know.
          flavor: latest=auto
          tags: |
            type=ref,event=tag
            type=raw,value=main-{{sha}},enable={{is_default_branch}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false   # keeps the index to just the two platforms
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest is the whole point of this job for a submission, so it is
      # surfaced rather than left to be dug out of the log.
      - name: Digest and next step
        run: |
          {
            echo '### Image published'
            echo
            echo '```'
            echo 'ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}'
            echo '```'
            echo
            echo 'Tags: `${{ steps.meta.outputs.tags }}`'
            echo
            echo 'To build the submission bundle against it:'
            echo
            echo '```bash'
            echo 'make bundle-submission \'
            echo '  OPERATOR_IMG=ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}'
            echo '```'
            echo
            echo '> First publish only: the GHCR package starts PRIVATE. It must be'
            echo '> made public, or the OperatorHub pipeline cannot pull it. There is'
            echo '> no REST API for package visibility — it is a one-time change at'
            echo '> Packages -> k8boss-operator -> Package settings -> Change visibility.'
          } >> "$GITHUB_STEP_SUMMARY"
